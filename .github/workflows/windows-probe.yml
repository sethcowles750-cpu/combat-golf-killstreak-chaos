name: Validate Windows game installation probe
on:
  push:
    paths:
      - "tools/windows_install_probe.ps1"
      - ".github/workflows/windows-probe.yml"
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse script and run without game installations
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\tools\windows_install_probe.ps1').Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          .\tools\windows_install_probe.ps1 -OutputPath "$env:RUNNER_TEMP\combat-golf-install-report.json"
          $report = Get-Content "$env:RUNNER_TEMP\combat-golf-install-report.json" -Raw | ConvertFrom-Json
          if ($report.tool -ne "Combat Golf Solo install probe") { throw "Missing expected probe report" }
          if ($report.golf.found -or $report.mwiii.found) { throw "Windows runner incorrectly reports game installations" }
