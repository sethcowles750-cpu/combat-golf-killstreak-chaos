name: Import Combat Golf Source
on:
  push:
    paths:
      - ".github/workflows/import-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source from the uploaded archive
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import stat

          archives = list(Path(".").glob("Combat-Golf-Killstreak-Chaos_GitHub-Source_v0.1.0-dev*.zip"))
          if len(archives) != 1:
              raise SystemExit(f"Expected one source archive; found {len(archives)}")
          archive = archives[0]
          with ZipFile(archive) as z:
              for item in z.infolist():
                  rel = Path(item.filename)
                  if rel.is_absolute() or ".." in rel.parts or (item.external_attr >> 16 & 0o170000) == stat.S_IFLNK:
                      raise SystemExit(f"Unsafe entry in source archive: {item.filename}")
              for item in z.infolist():
                  if item.filename == ".github/workflows/tests.yml":
                      continue  # GitHub Actions' built-in token cannot push new workflow files
                  z.extract(item, ".")
          archive.unlink()
          PY
      - name: Commit unpacked project source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Import Combat Golf source files into repository root"
          git push
